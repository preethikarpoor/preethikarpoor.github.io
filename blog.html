<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Blog & Reflections</title>
  <style>
    body {
      font-family: 'Helvetica Neue', sans-serif;
      background-color: #1c2340;
      color: #fff;
      margin: 0;
      padding: 2rem;
    }
    h1, h2 {
      color: #ffffff;
      margin-bottom: 0.5rem;
    }
    hr {
      border: 1px solid #444;
      margin-bottom: 2rem;
    }
    .iframe-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 1.5rem;
      margin-bottom: 3rem;
    }
    iframe.medium-embed {
      width: 100%;
      height: 400px;
      border: none;
      border-radius: 10px;
      overflow: hidden;
    }

    .swe-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 1.5rem;
    }
    .swe-card {
      background-color: #2e3655;
      border-radius: 8px;
      padding: 1rem;
      flex: 1 1 calc(33% - 1.5rem);
      box-shadow: 0 4px 6px rgba(0,0,0,0.3);
      max-width: 350px;
    }
    .swe-card img {
      width: 100%;
      border-radius: 6px;
      margin-bottom: 0.8rem;
    }
    .swe-card a {
      color: #7ed6df;
      text-decoration: none;
      font-weight: bold;
    }
    .swe-card a:hover {
      text-decoration: underline;
    }
    @media (max-width: 768px) {
      .swe-card {
        flex: 1 1 100%;
      }
    }
  </style>
</head>

<body>
  <h1>Blog & Reflections</h1>
  <hr />

  <h2>Medium Articles</h2>
  <div class="iframe-grid">

    <iframe class="medium-embed" src="https://medium.com/media/f4652609debf/embed"></iframe>
    <iframe class="medium-embed" src="https://medium.com/media/4a122ddd8e66/embed"></iframe>
    <iframe class="medium-embed" src="https://medium.com/media/8d5c09e83937/embed"></iframe>

  </div>

  <h2>SWE Ambassador Articles</h2>
  <div class="swe-grid">

    <div class="swe-card">
      <a href="https://alltogether.swe.org/2021/02/graduating-during-a-pandemic/" target="_blank">
        <img src="https://alltogether.swe.org/wp-content/uploads/2021/02/SWE-Global-Ambassador-Preethi-Karpoor.png" alt="Graduating During a Pandemic"/>
        Graduating During a Pandemic
      </a>
    </div>

    <div class="swe-card">
      <a href="https://alltogether.swe.org/2020/05/on-engineering-in-crisis-from-india-breaking-it-down/" target="_blank">
        <img src="https://alltogether.swe.org/wp-content/uploads/2020/05/engineering-in-crisis.png" alt="Engineering in Crisis"/>
        On Engineering in Crisis from India
      </a>
    </div>

    <div class="swe-card">
      <a href="https://alltogether.swe.org/2020/01/the-impact-of-ai-addressed-in-swe-india-roundtables/" target="_blank">
        <img src="https://alltogether.swe.org/wp-content/uploads/2020/01/ai-roundtable.png" alt="AI Roundtable"/>
        The Impact of AI in SWE India Roundtables
      </a>
    </div>

    <div class="swe-card">
      <a href="https://alltogether.swe.org/2020/06/mental-health-women-in-stem/" target="_blank">
        <img src="https://alltogether.swe.org/wp-content/uploads/2020/06/mental-health-stem.png" alt="Mental Health"/>
        Mental Health & Women in STEM
      </a>
    </div>

  </div>
</body>
</html>
